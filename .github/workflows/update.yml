name: update-activity

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/stats.py"]

permissions:
  contents: write

concurrency:
  group: update-activity
  cancel-in-progress: false

jobs:
  build:
    # the bot's own commits never retrigger (also guarded by [skip ci] in the message)
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Refresh heatmap and stats (keeps the committed files if the API call fails)
        env:
          GH_TOKEN: ${{ secrets.GH_STATS_TOKEN || secrets.GITHUB_TOKEN }}
        run: python scripts/stats.py
      - name: Commit if changed
        run: |
          git add README.md assets/heatmap-dark.svg assets/heatmap-light.svg data/stats.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: refresh activity [skip ci]"
            git push
          fi
